name: Build and publish GeoServer image

on:
  push:
    branches: [main]
    paths:
      - Dockerfile
      - integration-tests/**
      - versions.json
      - .github/workflows/build.yml
  pull_request:
    paths:
      - Dockerfile
      - integration-tests/**
      - versions.json
      - .github/workflows/build.yml
  workflow_dispatch:
    inputs:
      build_n:
        description: "Build number suffix (default: 1; increment for same-day hotfix rebuilds)"
        required: false
        default: "1"

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write
  security-events: write
  actions: read

jobs:
  build:
    name: build (${{ matrix.track }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        track: ["2.x", "3.x"]

    env:
      IMAGE: ghcr.io/wps/geoserver

    steps:
      - uses: actions/checkout@v7

      - name: Load GeoServer version for ${{ matrix.track }} from versions.json
        run: |
          GEOSERVER_VERSION=$(jq -r --arg track "${{ matrix.track }}" '.[$track].geoserver_version' versions.json)
          LATEST=$(jq -r --arg track "${{ matrix.track }}" '.[$track].latest' versions.json)
          if [ "$GEOSERVER_VERSION" = "null" ] || [ "$LATEST" = "null" ]; then
            echo "no entry for track '${{ matrix.track }}' in versions.json"
            exit 1
          fi
          echo "GEOSERVER_VERSION=${GEOSERVER_VERSION}" >> "$GITHUB_ENV"
          echo "LATEST=${LATEST}" >> "$GITHUB_ENV"
          echo "LOCAL_REF=geoserver-local:${GEOSERVER_VERSION}" >> "$GITHUB_ENV"

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build image
        run: |
          docker build \
            --build-arg GEOSERVER_VERSION=${{ env.GEOSERVER_VERSION }} \
            --label "org.opencontainers.image.created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.revision=${{ github.sha }}" \
            -t "${LOCAL_REF}" \
            .

      - name: Run integration tests
        run: |
          ./integration-tests/mvnw -f integration-tests/pom.xml verify \
            -Dgeoserver.image="${LOCAL_REF}" \
            -Dgeoserver.version="${{ env.GEOSERVER_VERSION }}"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ env.GEOSERVER_VERSION }}
          path: integration-tests/target/failsafe-reports/*.xml

      - name: Scan image for vulnerabilities (SARIF → Security tab)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_REF }}
          format: sarif
          output: trivy-${{ env.GEOSERVER_VERSION }}.sarif
          exit-code: "0"

      - name: Upload SARIF to GitHub Security
        if: always() && github.event_name != 'pull_request'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4.37.9
        with:
          sarif_file: trivy-${{ env.GEOSERVER_VERSION }}.sarif
          category: trivy-${{ env.GEOSERVER_VERSION }}

      - name: Generate SBOM (CycloneDX)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.LOCAL_REF }}
          format: cyclonedx
          output: sbom-${{ env.GEOSERVER_VERSION }}.cdx.json
          exit-code: "0"

      - name: Upload security artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: security-${{ env.GEOSERVER_VERSION }}
          path: |
            trivy-${{ env.GEOSERVER_VERSION }}.sarif
            sbom-${{ env.GEOSERVER_VERSION }}.cdx.json

      - name: Log in to ghcr.io
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        env:
          BUILD_N: ${{ github.event.inputs.build_n || '1' }}
        run: |
          FULL_TAG="${{ env.GEOSERVER_VERSION }}-$(date +%Y%m%d)-${BUILD_N}"
          docker tag "${LOCAL_REF}" "${IMAGE}:${{ env.GEOSERVER_VERSION }}"
          docker tag "${LOCAL_REF}" "${IMAGE}:${FULL_TAG}"
          docker push "${IMAGE}:${{ env.GEOSERVER_VERSION }}"
          docker push "${IMAGE}:${FULL_TAG}"
          if [[ "${{ env.LATEST }}" == "true" ]]; then
            docker tag "${LOCAL_REF}" "${IMAGE}:latest"
            docker push "${IMAGE}:latest"
          fi
