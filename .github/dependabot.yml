version: 2
updates:
  # docker (Dockerfile base images) is handled by Renovate (renovate.json),
  # since it reliably tracks digest updates for floating tags — see renovate.json
  - package-ecosystem: "maven"
    directory: "/integration-tests"
    schedule:
      interval: "monthly"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
